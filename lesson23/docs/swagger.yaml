definitions:
  main.ContactRequest:
    description: Contact form payload
    properties:
      email:
        example: user@example.com
        type: string
      message:
        example: Hello, world!
        type: string
    type: object
info:
  contact: {}
  description: Contact form payload
paths:
  /:
    get:
      description: Returns HTML Index page
      produces:
      - text/html
      responses:
        "200":
          description: Success html render
          schema:
            type: string
      summary: Base Index page
      tags:
      - Base
  /api/users/{id}:
    get:
      consumes:
      - application/json
      description: API handler for getting user info by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User name filter
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success getting user info
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by id
      tags:
      - auth
  /contacts:
    post:
      consumes:
      - application/json
      description: Accepts contact form data and returns status
      parameters:
      - description: Contact payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/main.ContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit contact form
      tags:
      - contacts
swagger: "2.0"
